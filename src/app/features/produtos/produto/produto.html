<mat-card class="produto-card">

<mat-card-header>
    <mat-card-title>{{ nome | uppercase}}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
     <p>{{ preco | precoFormatado }}</p>
    </mat-card-content>

    <mat-card-actions>
    <button mat-raised-button color="primary" (click)="selecionarProduto()">
        Selecionar
    </button>

    <button  mat-raised-button color="accent" (click)="adicionarAoCarrinho()">
        Adicionar ao Carrinho
    </button>

    <button mat-raised-button color="warn" (click)="favoritarProduto(nome)">
        Favoritar
    </button>
    
  </mat-card-actions>
</mat-card>
