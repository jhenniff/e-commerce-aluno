<mat-toolbar color="primary">
    <span>Mercado Liso</span>
    <span class="flex-spacer"></span>

    <button mat-button routerLink="/">Início</button>
    <button mat-button routerLink="/produtos">Produtos</button>
    <button matButton routerLink="/favoritos">Favoritos</button>
    <button mat-button routerLink="/carrinho">Carrinho | ({{quantidadeCarrinho()}})</button>
    <button mat-button routerLink="/checkout">Checkout</button>
    <button mat-button routerLink="/admin"> Admin</button>


    @if(usuarioLogado()){
        <span class="email-usuario">{{usuarioAtual()?.email}}</span>
        <button mat-button type="button"(click)="sair()">Sair</button>
     } @else{
            <button mat-button routerLink="/login">
                Entrar
            </button>
         
     }
    

</mat-toolbar>
